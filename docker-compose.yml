services:

  api:
    build:
      context: .
      dockerfile: bassoon-api/Dockerfile
    container_name: bassoon-api
    ports:
      - "8080:8080"
    networks:
      - bassoon
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  ui:
    build:
      context: bassoon-ui
      dockerfile: Dockerfile
    container_name: bassoon-ui
    ports:
      - "3000:80"
    networks:
      - bassoon
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  bassoon:
    driver: bridge
